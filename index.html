<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wish List Manager</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <form class="js-form">
      <label for="">Add Your Wish List Item</label>
      <div>
        <input
          class="new-item-field"
          type="text"
          placeholder="Enter your item"
        />
        <input class="price-field" type="number" placeholder="$ amount" />
        <button type="submit">Add</button>
      </div>
      <div class="error"></div>
    </form>
    <div class="total-item-container"></div>
    <div class="js-items"></div>
    <p class="js-status"></p>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
